[build]
  command = "vite build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
[images]
  remote_images = ["https://xogxpyzydlnmvweerjwj\\.supabase\\.co/storage/v1/object/public/.*"]

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon-32.png"
  status = 301
